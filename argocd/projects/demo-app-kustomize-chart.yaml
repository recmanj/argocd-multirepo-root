apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-app-kustomize-chart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Demo team — deploys the demo app from the demo-app-kustomize-chart repo using Kustomize helmCharts per env.
  sourceRepos:
    - git@github.com:recmanj/argocd-multirepo-demo-app-kustomize-chart.git
  destinations:
    - namespace: demo-app-kustomize-chart
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
    - group: networking.k8s.io
      kind: Ingress
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
